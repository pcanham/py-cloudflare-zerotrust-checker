{% extends "base.html" %}

{% block body %}
  <h1 class="mb-4">Cloudflare Zero Trust & Gateway Policy Checker</h1>
  <div class="alert alert-info mt-3">
  Current Celery Queue Length: {{ queue_length }}
  </div>

  <form onsubmit="submitForm(event)" class="mb-3">
    <div class="form-group">
      <label for="ip">IP Address</label>
      <input
        type="text"
        id="ip"
        name="ip_address"
        class="form-control"
        placeholder="e.g. 8.8.8.8"
        required
      >
    </div>
    <button type="submit" class="btn btn-primary mt-2">Search</button>
  </form>

  <!-- Progress bar -->
  <div class="progress mb-3" style="height: 25px;">
    <div
      id="progressBar"
      class="progress-bar"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      style="width: 0%;"
    >0%</div>
  </div>

  <!-- Final output -->
  <div class="card">
    <div class="card-body">
      <pre id="output" class="mb-0" style="white-space: pre-wrap;"></pre>
    </div>
  </div>

  <script>
    const progressBar = document.getElementById('progressBar');
    const outputEl    = document.getElementById('output');

    function updateProgress(percent) {
      const p = Math.min(100, Math.max(0, Math.round(percent)));
      progressBar.style.width   = p + '%';
      progressBar.textContent   = p + '%';
    }

    function showOutput(msg) {
      outputEl.textContent = msg;
    }

    async function submitForm(e) {
      e.preventDefault();
      // reset state
      updateProgress(0);
      showOutput('');
      
      const ip = document.getElementById('ip').value.trim();
      if (!ip) return;

      try {
        const res = await fetch('/check', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: `ip_address=${encodeURIComponent(ip)}`
        });
        const { task_id, error } = await res.json();
        if (error) {
          return showOutput(error);
        }
        pollStatus(task_id);
      }
      catch (err) {
        showOutput(`Request failed: ${err.message}`);
      }
    }

    async function pollStatus(id) {
      try {
        const res  = await fetch(`/status/${id}`);
        const data = await res.json();

        if (data.state === 'PENDING') {
          // still queued
          setTimeout(() => pollStatus(id), 1000);
        }
        else if (data.state === 'PROGRESS') {
          // expects data.meta.percent (0–100)
          updateProgress(data?.percent || 0);
          setTimeout(() => pollStatus(id), 1000);
        }
        else if (data.state === 'SUCCESS') {
          updateProgress(100);
          showOutput(JSON.stringify(data.result, null, 2));
        }
        else {
          // FAILURE or other terminal state
          showOutput(`Error: ${data.error || 'Unknown error'}`);
        }
      }
      catch (err) {
        showOutput(`Polling failed: ${err.message}`);
      }
    }
  </script>
{% endblock %}
