---
services:
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
  web:
    build: .
    env_file: .env
    command:
      - uv
      - run
      - flask
      - run
      - --host=0.0.0.0
      - --port=8080
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - worker
  worker:
    build: .
    env_file: .env
    command:
      - uv
      - run
      - celery
      - -A
      - tasks.celery
      - worker
      - --loglevel=info
      - --queues=default
    depends_on:
      - redis
    user: "1000:1000"
